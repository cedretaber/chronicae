# v0.35: display labels for battle event enums (battlefieldKind / result / avoidingSide).
#   sim-layer params stay raw enum strings; eventRenderer resolves these at render time.
#   battlefieldKind labels are battle-type names so the template "A {kind} broke out" reads
#   naturally (e.g. "A Siege broke out"). Kept distinct from terrain (detail.terrain_value):
#   battlefieldKind is a separate concept (feature-derived River/Coastal, future Siege).
enum:
  battlefieldKind:
    open_field: 'Field Battle'
    forest_battle: 'Forest Battle'
    hill_battle: 'Hill Battle'
    mountain_pass: 'Mountain Battle'
    wetland_battle: 'Wetland Battle'
    river_crossing: 'River-Crossing Battle'
    coastal_battle: 'Coastal Battle'
    siege: 'Siege'
  result:
    attacker_victory: 'Attacker Victory'
    defender_victory: 'Defender Victory'
    inconclusive: 'Inconclusive'
  avoidingSide:
    attacker: 'The attacker'
    defender: 'The defender'
    both: 'Both sides'
  outcomeQuality:
    orderly_withdrawal: 'orderly withdrawal'
    rout: 'rout'
    encirclement: 'encirclement'
  breakthroughSide:
    attacker: 'attacker'
    defender: 'defender'
