    narrow_victory: 'A {{battlefieldKind}} at {{province}} ({{attackerName}} {{attackerRegimentCount}} vs {{defenderName}} {{defenderRegimentCount}} regiments). After {{ticksElapsed}} days of hard fighting, {{winnerName}} narrowly prevailed (routed: {{attackerName}} {{attackerRoutedCount}}, {{defenderName}} {{defenderRoutedCount}}). War score change: {{warScoreDelta}}.'

