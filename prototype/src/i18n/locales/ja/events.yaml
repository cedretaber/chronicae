  battle:
    outnumbered_victory: '{{province}}での{{battlefieldKind}}（連隊 {{attackerRegimentCount}} 対 {{defenderRegimentCount}}）。数的劣勢を覆し、{{result}}を収めた。戦勝点変化: {{warScoreDelta}}。'
